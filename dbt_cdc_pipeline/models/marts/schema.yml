version: 2
models:
  - name: mart_trade_orderbook_1m
    description: >
      체결 × 호가 분 단위 결합 마트. 거래소가 호가 이력을 주지 않으므로 우리만 가진 데이터.
      유동성 플래그와 규칙 평가의 설명 변수(스프레드·깊이·체결/깊이 비율)가 붙는 자리 (docs/19 §2-1, docs/27).
    columns:
      - name: market
        tests: [not_null]
      - name: minute
        tests: [not_null]
      - name: spread_bp_avg
        description: 분 평균 스프레드(bp). 얇은 호가 지표
      - name: volume_over_depth15
        description: 그 분 체결 수량 / 15호가 평균 잔량(양쪽 합). 1 이상이면 호가 전체만큼 체결

  - name: mart_daily_summary
    description: "일별 종합(KST 기준): 종가·거래량·VWAP·전일 대비. 금액·수량은 Decimal, 비율은 Float64(docs/34 #5 타입 규약)."
    columns:
      - name: day_kst
        tests: [not_null]
      - name: market
        tests: [not_null]
