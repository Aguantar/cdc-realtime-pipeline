version: 2
models:
  - name: dim_markets
    description: >
      마켓 마스터: 거래소 목록·이름·경보 플래그·상장일 근사(일봉 200일 창 첫 봉) + 우리가 처음 본 체결.
      규칙 평가의 신규 상장 96h 제외와 커버리지 사유의 기준 (docs/26 §4).
    columns:
      - name: market
        tests: [not_null, unique]
      - name: coverage_gap_days
        description: 전 마켓 수집 시작(2026-09-09) 이후 상장 마켓의 '상장일 → 우리 첫 체결' 일수. BFC=6 이 사고의 숫자
      - name: listing_date_source
        tests:
          - accepted_values:
              values: ['daily_candle_first', 'before_window', 'unknown']

  - name: dim_coins
    description: "코인 차원(docs/34 #4): coin_id 로 Upbit 마켓과 Binance 심볼을 잇는다. 별칭은 seed coin_alias"
    columns:
      - name: coin_id
        tests: [unique, not_null]
      - name: upbit_market
        tests: [unique, not_null]
      - name: binance_symbol
        tests:
          - unique:
              where: "binance_symbol != ''"

  - name: dim_exchange_notices
    description: >
      거래소 공지 분류(docs/33 라벨링). scope = exchange_wide(서버 점검, 전 마켓 정지) | market(코인별 거래지원 중단)
      | deposit_withdrawal(입출금만, 거래는 계속) | other. 카테고리가 아니라 제목으로 나누는 이유는
      업비트 category='점검' 이 대부분 신분증·원화 입출금이라 거래를 멈추지 않기 때문(실측 1,200건).
    columns:
      - name: notice_id
        tests: [not_null, unique]
      - name: scope
        tests:
          - not_null
          - accepted_values:
              values: ['exchange_wide', 'market', 'deposit_withdrawal', 'other']
      - name: halts_trading
        tests: [not_null]
  - name: dim_market_state_scd
    description: >
      마켓 거래 상태 이력(SCD2, docs/34 #9). ACTIVE | PREDELISTING | DELISTED + 폐지 예정일.
      원천은 10분 폴링(poll_market_state.py) — 이 정보는 웹소켓 ticker 에만 있고 REST 에는 없다.
      쓰임: 커버리지 판정에서 거래불가 마켓 제외, 마켓 수 감소가 폐지인지 유실인지 구분.
      한계: 첫 구간의 valid_from 은 관측 시작(2026-09-20)이라 '적어도 그때부터'다.
    columns:
      - name: market
        tests: [not_null]
      - name: market_state
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'PREDELISTING', 'DELISTED', 'PREVIEW', 'UNKNOWN']
      - name: valid_from
        tests: [not_null]
      - name: is_tradable
        tests: [not_null]
  - name: dim_market_flag_scd
    description: "Upbit 시장경보 플래그의 이력(SCD type 2). 거래소 지정/해제 이력 + 우리 폴링 전이를 합쳐 '언제부터 언제까지 켜져 있었나'를 답한다."
    columns:
      - name: market
        tests: [not_null]
      - name: flag
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: source
        tests:
          - accepted_values:
              values: ['exchange_records', 'polled']
