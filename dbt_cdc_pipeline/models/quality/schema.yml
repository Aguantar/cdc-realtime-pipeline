version: 2

models:
  - name: dq_reconcile_daily
    description: "일별 원장 대조 요약 (가중 비율·99% 미만 셀·0건 셀·최악 셀). 유실 0 의 일일 증거."
    columns:
      - name: day_utc
        tests: [not_null, unique]
      - name: weighted_pct
        description: "거래소 시간봉 거래량 대비 우리 체결 거래량, 하루 가중."
  - name: dq_ingest_gaps_labeled
    description: >
      수집 공백에 거래소 공지로 설명을 붙인 표. explained_by_maintenance=1 이면 그 공백은 유실이 아니라
      거래소 점검이다. 코인별 중단은 창을 지어내지 않고 후보로만 둔다(본문에 재개 시각만 있는 경우가 있다).
    columns:
      - name: window_start
        tests: [not_null]
      - name: explained_by_maintenance
        tests: [not_null]
  - name: dq_repairs_daily
    description: "유입 공백 수리 계보(창 단위)의 일별 요약. reason = reconnect | startup | manual."
    columns:
      - name: day_utc
        tests: [not_null]
      - name: reason
        # 수리 트리거는 세 가지뿐이다. 넷째 값이 나오면 수리 경로에 모르는 분기가 생긴 것
        tests:
          - not_null
          - accepted_values:
              values: ['reconnect', 'startup', 'manual']
  - name: dq_ingest_daily
    description: "일별 적재 지연 분위수·늦은 행·마켓 수. 증분 재계산(전날~오늘)."
    columns:
      - name: day_utc
        tests: [not_null, unique]
  - name: dq_rule_eval_daily
    description: >
      이상탐지 규칙(PRICE_24H 섀도, VOLUME_24H)을 거래소 지정 이력과 매일 대조한 정밀도·재현율·선행 시간.
      규칙의 존재 이유이자 승격 판단 근거 (docs/16 §5, docs/22).
    columns:
      - name: rule
        tests:
          - accepted_values:
              values: ['PRICE_24H', 'VOLUME_24H']

  - name: dq_alert_parity_daily
    description: >
      PRICE_24H 구현 동등성: Flink 탐지기의 등급 전이 vs 같은 입력(crypto_trades)에서 SQL 로 재계산한 전이를
      마켓·(prev, level)·±60초로 매일 대조. 전이 10건 이상이 전부 일치(parity_ok)하면 승격 (docs/22 §4).
    columns:
      - name: day_utc
        tests: [not_null, unique]
      - name: matched
        tests: [not_null]

  - name: dq_orderbook_gaps_daily
    description: >
      호가 유실 창 기록. 호가는 이력 API 도 원장도 없어 못 받은 순간 영구 유실이므로, 초당 스냅샷 0 인 구간(3초 이상)을 gap 으로
      잡고 추정 유실 건수를 남긴다. 브로커 축소·수집기 버퍼 결정의 근거 (docs/23 §6).
    columns:
      - name: day_utc
        tests: [not_null, unique]
      - name: zero_seconds
        tests: [not_null]

  - name: dq_binance_reconcile_daily
    description: "Binance 체결 일별 대조: 거래소 1시간 캔들의 체결 수 vs 우리 binance_trades FINAL. 09-20 첫 시간 100.000%."
    columns:
      - name: day_utc
        tests: [not_null, unique]
      - name: weighted_pct
        description: "거래소 체결 수 대비 우리 행수, 하루 가중. 99.9% 미만이면 quality_alerts 가 Slack 으로 알린다."
  - name: dq_ledger_daily
    description: "2층 원장 3자 대조: 거래소 REST = MySQL = ClickHouse FINAL. ex_my_mismatch / my_ch_mismatch 가 0 이어야 CDC 가 변경을 하나도 안 놓친 것."
    columns:
      - name: day_utc
        tests: [not_null]
      - name: symbol
        tests: [not_null]
