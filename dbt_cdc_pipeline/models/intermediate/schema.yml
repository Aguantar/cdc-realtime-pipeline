version: 2

models:
  - name: int_ohlcv_1h
    description: >
      1시간봉 OHLCV 집계. Flink 5분 윈도우(trade_aggregations)와 역할 분리 —
      Flink은 실시간 스트리밍 집계, DBT는 raw 틱 기반 정확한 배치 OHLCV.
    columns:
      - name: market
        tests:
          - not_null
      - name: hour_start
        tests:
          - not_null
      - name: open
        description: "시가 (시간 내 첫 체결가)"
      - name: high
        description: "고가"
      - name: low
        description: "저가"
      - name: close
        description: "종가 (시간 내 마지막 체결가)"
      - name: vwap
        description: "거래량 가중 평균 가격"

  - name: int_ohlcv_daily
    description: >
      일봉 OHLCV 집계. 전일 대비 변동폭 포함.
    columns:
      - name: market
        tests:
          - not_null
      - name: trade_date
        tests:
          - not_null
      - name: daily_range_pct
        description: "일중 변동폭 (%)"
