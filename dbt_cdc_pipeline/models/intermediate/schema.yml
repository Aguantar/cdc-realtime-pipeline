version: 2

models:
  - name: int_ohlcv_1h
    description: >
      1시간봉 OHLCV 집계(이벤트 시각). Flink 5분 처리 시간 집계는 2026-09-19 폐기·표는 09-20 삭제(docs/29 §7) —
      Flink은 실시간 스트리밍 집계, DBT는 raw 틱 기반 정확한 배치 OHLCV.
    columns:
      - name: market
        tests:
          - not_null
      - name: hour_kst
        tests:
          - not_null
      - name: open
        description: "시가 (시간 내 첫 체결가)"
      - name: high
        description: "고가"
      - name: low
        description: "저가"
      - name: close
        description: "종가 (시간 내 마지막 체결가)"
      - name: vwap
        description: "거래량 가중 평균 가격"

  - name: int_ohlcv_daily
    description: >
      일봉 OHLCV 집계. 전일 대비 변동폭 포함.
    columns:
      - name: market
        tests:
          - not_null
      - name: day_kst
        tests:
          - not_null
      - name: daily_range_pct
        description: "일중 변동폭 (%)"

  - name: int_alert_transitions_recomputed
    description: >
      PRICE_24H 등급 전이를 crypto_trades 에서 SQL 로 재계산(분 종가·forward fill·24h 참조·늦은 이벤트 제외).
      Flink 탐지기와 같은 정의, 다른 구현. dq_alert_parity_daily 의 입력 (docs/22 §4).
    columns:
      - name: market
        tests: [not_null]
